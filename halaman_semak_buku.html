<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REKOD SEMAKAN BUKU MURID</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e3a8a; --bg: #f1f5f9; }
        body { background: var(--bg); padding: 20px; font-family: 'Inter', sans-serif; }
        .form-container { background: white; max-width: 650px; margin: 0 auto; padding: 35px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); border-top: 10px solid var(--primary); }
        .label { color: #334155; font-weight: 700; }
        .select, select { width: 100% !important; }
        .btn-submit { background: var(--primary); color: white; width: 100%; border-radius: 12px; font-weight: 700; height: 55px; }
    </style>
</head>
<body>
    <div class="form-container">
        <div class="has-text-centered mb-5">
            <img src="logo_sksr.png" style="width: 80px;" onerror="this.src='https://via.placeholder.com/80?text=LOGO'">
            <h1 class="title is-4 mb-1">REKOD SEMAKAN BUKU MURID</h1>
            <p class="subtitle is-6 has-text-grey">PENGURUSAN KURIKULUM • SK SIMPANG RENGAM</p>
        </div>

        <form id="semakForm">
            <div class="field">
                <label class="label">Nama Guru</label>
                <div class="control has-icons-left">
                    <div class="select">
                        <select id="namaGuru" required>
                            <option value="">Memuatkan senarai guru...</option>
                        </select>
                    </div>
                    <span class="icon is-small is-left"><i class="fas fa-user"></i></span>
                </div>
            </div>

            <div class="columns">
                <div class="column">
                    <div class="field">
                        <label class="label">Mata Pelajaran</label>
                        <div class="control">
                            <div class="select">
                                <select id="subjek" required>
                                    <option value="">Sila Pilih...</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">Kelas</label>
                        <input class="input" type="text" id="kelas" placeholder="Contoh: 6 Bijak" required>
                    </div>
                </div>
            </div>

            <div class="columns">
                <div class="column">
                    <div class="field">
                        <label class="label">Bil. Murid</label>
                        <input class="input" type="number" id="bilMurid" required>
                    </div>
                </div>
                <div class="column">
                    <div class="field">
                        <label class="label">Bil. Buku Dihantar</label>
                        <input class="input" type="number" id="bilBuku" required>
                    </div>
                </div>
            </div>

            <div class="field">
                <label class="label">Ulasan Semakan</label>
                <textarea class="textarea" id="ulasan" rows="2" placeholder="Tulis ulasan ringkas..."></textarea>
            </div>

            <button type="submit" id="submitBtn" class="button btn-submit mt-4">
                <i class="fas fa-save mr-2"></i> HANTAR & JANA PDF
            </button>
        </form>
        <p class="has-text-centered is-size-7 mt-6 has-text-grey">Sistem Inovasi Digital : D'SiRe @2026</p>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbywTrF6KM_7q3-D4jXGTLpY7goCatWQvkS4UKVhyzmcugAwA-IX-VMud20tn80cOarD2Q/exec'; // GANTIKAN DENGAN URL BARU

        // LOAD DATA UNTUK DROPDOWN
        window.onload = function() {
            fetch(scriptURL)
                .then(res => res.json())
                .then(data => {
                    const guruSelect = document.getElementById('namaGuru');
                    const subjekSelect = document.getElementById('subjek');
                    
                    guruSelect.innerHTML = '<option value="">Pilih Nama Guru</option>';
                    data.guru.forEach(n => { guruSelect.innerHTML += `<option value="${n}">${n}</option>`; });
                    
                    subjekSelect.innerHTML = '<option value="">Pilih Subjek</option>';
                    data.subjek.forEach(s => { subjekSelect.innerHTML += `<option value="${s}">${s}</option>`; });
                });
        };

        const form = document.getElementById('semakForm');
        const btn = document.getElementById('submitBtn');

        form.addEventListener('submit', e => {
            e.preventDefault();
            btn.innerHTML = "<i class='fas fa-spinner fa-spin'></i> Menjana PDF...";
            btn.disabled = true;

            const data = {
                namaGuru: document.getElementById('namaGuru').value,
                subjek: document.getElementById('subjek').value,
                kelas: document.getElementById('kelas').value,
                bilMurid: document.getElementById('bilMurid').value,
                bilBuku: document.getElementById('bilBuku').value,
                ulasan: document.getElementById('ulasan').value
            };

            fetch(scriptURL, { method: 'POST', body: JSON.stringify(data)})
            .then(() => {
                alert("Rekod Berjaya! Sila semak folder arkib PDF.");
                form.reset();
                btn.innerHTML = "HANTAR & JANA PDF";
                btn.disabled = false;
            })
            .catch(() => {
                alert("Ralat! Cuba lagi.");
                btn.disabled = false;
            });
        });
    </script>
</body>
</html>
