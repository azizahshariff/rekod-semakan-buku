<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Unit Kurikulum</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #1e3a8a; --sidebar-bg: #ffffff; }
        body { background: #f1f5f9; display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: var(--sidebar-bg); border-right: 1px solid #e2e8f0; padding: 20px; display: flex; flex-direction: column; }
        .main-view { flex-grow: 1; overflow-y: auto; padding: 30px; }
        .nav-item { display: flex; align-items: center; padding: 12px 15px; color: #64748b; border-radius: 10px; cursor: pointer; transition: 0.3s; margin-bottom: 5px; }
        .nav-item:hover, .nav-item.is-active { background: #eff6ff; color: var(--primary); font-weight: bold; }
        .hero-box { background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); text-align: center; }
        iframe { width: 100%; height: 100%; border: none; border-radius: 10px; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="has-text-centered mb-6">
            <h1 class="title is-5 has-text-link">Rekod Semakan Buku Murid</h1>
            <p class="is-size-7">SK Simpang Rengam</p>
        </div>
        
        <div class="nav-item is-active" onclick="location.reload()">
            <i class="fas fa-chart-line mr-3"></i> Dashboard
        </div>
        
        <p class="menu-label mt-5">Pengurusan Kurikulum</p>
        <div class="nav-item" onclick="loadFrame('halaman_semak_buku.html')">
            <i class="fas fa-book-open mr-3"></i> e-Rekod Semakan
        </div>
        
        <div class="nav-item" onclick="loadFrame('https://drive.google.com/embeddedfolderview?id=1MFgY7V2QDDZzg8251P5qZvyoAbgFcwb7#list')">
            <i class="fas fa-file-pdf mr-3"></i> Arkib PDF Guru
        </div>

        <div style="margin-top: auto;">
            <p class="is-size-7 has-text-centered color-light">Sistem Inovasi Digital D'SiRe © 2026</p>
        </div>
    </div>

    <div class="main-view" id="contentArea">
        <div class="hero-box">
            <h1 class="title is-3">REKOD SEMAKAN BUKU MURID</h1>
            <div class="columns mt-6">
                <div class="column">
                    <div class="box has-background-link has-text-white" style="cursor:pointer" onclick="loadFrame('halaman_semak_buku.html')">
                        <i class="fas fa-edit fa-3x mb-3"></i>
                        <p class="is-size-5 has-text-weight-bold">ISI SEMAKAN</p>
                    </div>
                </div>
                <div class="column">
                    <div class="box has-background-info has-text-white" style="cursor:pointer" onclick="loadFrame('https://drive.google.com/embeddedfolderview?id=1MFgY7V2QDDZzg8251P5qZvyoAbgFcwb7#list')">
                        <i class="fas fa-folder-open fa-3x mb-3"></i>
                        <p class="is-size-5 has-text-weight-bold">LIHAT PDF</p>
                    </div>
                </div>
            </div>

            <div class="mt-6">
                <h3 class="subtitle is-6">STATISTIK SEMAKAN SEMASA</h3>
                <div style="height: 400px; border: 1px solid #ddd; border-radius: 10px; overflow: hidden;">
                    <iframe src="SALIN_LINK_SPREADSHEET_PUBLISH_TO_WEB_DISINI"></iframe>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadFrame(url) {
            const area = document.getElementById('contentArea');
            area.innerHTML = `<iframe src="${url}"></iframe>`;
            // Set nav active state
            document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('is-active'));
            event.currentTarget.classList.add('is-active');
        }
    </script>
</body>
</html>
