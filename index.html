<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Kurikulum - SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --primary: #1e3a8a; --bg: #f4f7fa; --sidebar: 260px; }
        body { background-color: var(--bg); display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        .sidebar { width: var(--sidebar); background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .sidebar-header { text-align: center; padding: 30px 20px; }
        .sidebar-header img { width: 55px; }
        .nav-link { padding: 12px 25px; display: flex; align-items: center; color: #64748b; cursor: pointer; font-size: 0.85rem; transition: 0.2s; border-radius: 8px; margin: 2px 15px; }
        .nav-link:hover { background: #f1f5f9; color: var(--primary); }
        .nav-link.is-active { background: #eff6ff; color: #1e40af; font-weight: 700; }
        .nav-group-title { padding: 15px 25px 5px; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        iframe { width: 100%; height: 85vh; border: none; border-radius: 15px; }
        #loader-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255, 255, 255, 0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; display: none; }
        .spinner { border: 5px solid #f3f3f3; border-top: 5px solid var(--primary); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .card-menu { display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 900px; flex-wrap: wrap; }
        .menu-item { background: white; border-radius: 18px; padding: 40px 20px; text-align: center; cursor: pointer; transition: 0.3s; width: 220px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 12px 25px rgba(0,0,0,0.1); }
        .menu-item i { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        .menu-item span { font-weight: 700; font-size: 0.85rem; color: #334155; text-transform: uppercase; }
        .icon-isi { color: #1e40af; } .icon-semak { color: #ef4444; } .icon-arkib { color: #f59e0b; }
    </style>
</head>
<body>

    <div id="loader-overlay">
        <div class="spinner"></div>
        <p class="mt-4 has-text-weight-bold" style="color: var(--primary); letter-spacing: 1px;">SILA TUNGGU...</p>
    </div>

    <div class="sidebar">
        <div class="sidebar-header">
            <img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png">
            <p style="font-weight: 700; color: var(--primary); font-size: 0.85rem; margin-top: 10px;">REKOD SEMAKAN BUKU MURID</p>
            <p class="subtitle is-6 has-text-grey">SK Simpang Rengam</p>
        </div>
        <div class="nav-link" onclick="location.reload()"><i class="fas fa-home mr-3"></i> Laman Utama</div>
        <div class="nav-group-title">Menu Utama</div>
        <div class="nav-link" onclick="loadFrame('halaman_semak_buku.html')"><i class="fas fa-edit mr-3"></i> Isi Laporan</div>
        <div class="nav-link" onclick="openPdfSearch()"><i class="fas fa-file-search mr-3"></i> Carian Fail PDF</div>
    </div>

    <div class="main-content" id="mainArea">
        <div id="headerSection" class="has-text-centered mb-6">
            <img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png" width="70">
            <h1 class="title is-3" style="color: var(--primary); margin-top: 10px;">SISTEM PENGURUSAN KURIKULUM</h1>
            <p class="subtitle is-6 has-text-grey">SK Simpang Rengam</p>
        </div>

        <div class="card-menu" id="mainMenu">
            <div class="menu-item" onclick="loadFrame('halaman_semak_buku.html')"><i class="fas fa-pencil-alt icon-isi"></i><span>ISI LAPORAN</span></div>
            <div class="menu-item" onclick="openPdfSearch()"><i class="fas fa-file-pdf icon-arkib"></i><span>FAIL PDF</span></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbyJkmYgJXzojMmEgVHuh-aR8GkegycSjAP-Avn_Xw7H0kr13IbVUTiUmNH6Fx-imLMf0A/exec';
        const sheetID = '1T7GcIbxlqQiaBcjE7LaKAUzANhzzGtS--_xDyKXizCg';

        function toggleLoader(show) {
            document.getElementById('loader-overlay').style.display = show ? 'flex' : 'none';
        }

        // 1. Fungsi Membuka Halaman Carian PDF & Mengambil Dropdown Subjek
        function openPdfSearch() {
            const mainArea = document.getElementById('mainArea');
            mainArea.innerHTML = `
                <div style="width:100%; max-width:800px;">
                    <button class="button is-small is-light mb-4" onclick="location.reload()">← Kembali</button>
                    <div class="box" style="border-radius: 20px; padding: 30px;">
                        <h2 class="title is-4 has-text-link"><i class="fas fa-file-pdf mr-2"></i> CARIAN FAIL PDF LAPORAN</h2>
                        <div class="field">
                            <label class="label">Pilih Mata Pelajaran</label>
                            <div class="control is-expanded">
                                <div class="select is-fullwidth is-link is-rounded">
                                    <select id="pdfSubjectSelect">
                                        <option value="">-- Memuatkan Subjek... --</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                        <div class="control mt-4">
                            <button class="button is-link is-fullwidth is-rounded" onclick="drawPdfTable()">CARI FAIL PDF</button>
                        </div>
                        <hr>
                        <div id="pdfResultArea"></div>
                    </div>
                </div>
            `;
            fetchSubjectDropdown();
        }

        // 2. Ambil senarai subjek dari tab "tetapan"
        function fetchSubjectDropdown() {
            const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&sheet=tetapan&range=A2:A`;
            
            fetch(url).then(r => r.text()).then(t => {
                const j = JSON.parse(t.substr(47).slice(0,-2));
                const select = document.getElementById('pdfSubjectSelect');
                select.innerHTML = '<option value="">-- Pilih Mata Pelajaran --</option>';
                
                j.table.rows.forEach(r => {
                    if(r.c[0] && r.c[0].v) {
                        let opt = document.createElement('option');
                        opt.value = r.c[0].v;
                        opt.text = r.c[0].v;
                        select.add(opt);
                    }
                });
            });
        }

        // 3. Cari data di tab "rekod_semakan"
        function drawPdfTable() {
            const subject = document.getElementById('pdfSubjectSelect').value;
            if (!subject) return alert("Sila pilih mata pelajaran dahulu");

            toggleLoader(true);
            const resultArea = document.getElementById('pdfResultArea');
            
            // Query: Cari subjek di Lajur F (Subjek) dalam tab rekod_semakan
            let q = encodeURIComponent(`SELECT B, C, F, U WHERE F = '${subject}' ORDER BY B DESC`);
            let url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${q}&sheet=rekod_semakan`;

            fetch(url).then(r => r.text()).then(t => {
                let j = JSON.parse(t.substr(47).slice(0,-2));
                
                if (!j.table.rows || j.table.rows.length === 0) {
                    resultArea.innerHTML = `
                        <div class="notification is-danger is-light has-text-centered">
                            <i class="fas fa-exclamation-circle mr-2"></i> <strong>Tiada rekod ditemui</strong> untuk subjek ${subject}.
                        </div>`;
                    return;
                }

                let html = `
                    <div class="table-container">
                        <table class="table is-fullwidth is-striped is-hoverable">
                            <thead>
                                <tr style="background: #eff6ff">
                                    <th>Tarikh</th>
                                    <th>Guru</th>
                                    <th>Tindakan</th>
                                </tr>
                            </thead>
                            <tbody>`;

                j.table.rows.forEach(r => {
                    let tarikh = r.c[0] ? (r.c[0].f || r.c[0].v) : "-";
                    let guru = r.c[1]?.v || "-";
                    let link = r.c[3]?.v;

                    html += `
                        <tr>
                            <td class="is-size-7">${tarikh}</td>
                            <td class="is-size-7 has-text-weight-bold">${guru}</td>
                            <td>
                                ${link ? `<a href="${link}" target="_blank" class="button is-small is-danger is-outlined is-rounded"><i class="fas fa-file-pdf"></i></a>` : '<span class="tag is-light">Tiada Fail</span>'}
                            </td>
                        </tr>`;
                });

                html += `</tbody></table></div>`;
                resultArea.innerHTML = html;
            })
            .catch(err => {
                resultArea.innerHTML = '<p class="has-text-danger">Ralat sistem. Sila cuba lagi.</p>';
            })
            .finally(() => toggleLoader(false));
        }

        function loadFrame(url) {
            document.getElementById('mainArea').innerHTML = `<div style="width:100%"><button class="button is-small is-light mb-2" onclick="location.reload()">← Kembali</button><iframe src="${url}"></iframe></div>`;
        }
    </script>
</body>
</html>
