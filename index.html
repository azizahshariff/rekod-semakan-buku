<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Unit Kurikulum - SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --sidebar-bg: #f8f9fa; --active-color: #1e3a8a; --text-grey: #6c757d; }
        body { background-color: #ffffff; display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', sans-serif; }
        
        /* Sidebar Styles */
        .sidebar { width: 250px; background: var(--sidebar-bg); border-right: 1px solid #e9ecef; display: flex; flex-direction: column; padding: 20px 0; }
        .sidebar-header { text-align: center; padding: 0 20px 30px; border-bottom: 1px solid #dee2e6; margin-bottom: 20px; }
        .sidebar-header img { width: 60px; margin-bottom: 10px; }
        
        .menu-label { padding: 0 25px; font-size: 0.75rem; color: var(--text-grey); text-transform: uppercase; letter-spacing: 1px; margin-top: 20px; }
        .nav-link { padding: 12px 25px; display: flex; align-items: center; color: #495057; cursor: pointer; transition: 0.2s; font-size: 0.9rem; }
        .nav-link i { width: 25px; margin-right: 10px; font-size: 1.1rem; }
        .nav-link:hover { background: #e9ecef; color: var(--active-color); }
        .nav-link.is-active { background: #e9ecef; color: var(--active-color); font-weight: 600; border-left: 4px solid var(--active-color); }

        /* Main Area */
        .main-content { flex-grow: 1; overflow-y: auto; background: #ffffff; }
        .container-fluid { padding: 40px; }
        
        .header-section { text-align: center; margin-bottom: 50px; }
        .header-section img { width: 80px; margin-bottom: 15px; }
        .header-section h1 { color: #1e3a8a; font-size: 2.5rem; font-weight: 800; margin-bottom: 5px; }
        .header-section p { color: var(--text-grey); font-size: 1.1rem; }

        /* Navigation Cards */
        .card-menu { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .menu-item { background: #ffffff; border: 1px solid #dee2e6; border-radius: 15px; padding: 30px 10px; text-align: center; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); border-color: var(--active-color); }
        .menu-item i { font-size: 2.5rem; margin-bottom: 15px; display: block; }
        .menu-item span { font-weight: bold; color: #343a40; text-transform: uppercase; font-size: 0.85rem; }

        .footer-text { text-align: center; margin-top: 60px; color: #ced4da; font-size: 0.75rem; }
        iframe { width: 100%; height: 90vh; border: none; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png" alt="Logo Sekolah">
            <p class="is-size-7 has-text-weight-bold">SK SIMPANG RENGAM</p>
        </div>
        
        <div class="nav-link is-active" onclick="location.reload()">
            <i class="fas fa-home"></i> Laman Utama
        </div>

        <p class="menu-label">Pengurusan</p>
        <div class="nav-link" onclick="loadFrame('halaman_semak_buku.html')">
            <i class="fas fa-edit"></i> Isi Laporan
        </div>

        <p class="menu-label">Semakan Status</p>
        <div class="nav-link" onclick="toggleFilter()">
            <i class="fas fa-chart-bar"></i> Status Semakan
        </div>

        <p class="menu-label">Arkib</p>
        <div class="nav-link" onclick="loadFrame('https://drive.google.com/embeddedfolderview?id=1MFgY7V2QDDZzg8251P5qZvyoAbgFcwb7#list')">
            <i class="fas fa-file-pdf"></i> Laporan PDF
        </div>
    </div>

    <div class="main-content" id="mainArea">
        <div class="container-fluid">
            
            <div class="header-section">
                <img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png" alt="Logo">
                <h1>PENGURUSAN UNIT KURIKULUM</h1>
                <p>SK Simpang Rengam • Rekod Semakan Buku Murid</p>
            </div>

            <div class="card-menu">
                <div class="menu-item" onclick="loadFrame('halaman_semak_buku.html')">
                    <i class="fas fa-edit has-text-link"></i>
                    <span>ISI LAPORAN</span>
                </div>
                <div class="menu-item" onclick="toggleFilter()">
                    <i class="fas fa-list-check has-text-danger"></i>
                    <span>STATUS SEMAKAN</span>
                </div>
                <div class="menu-item" onclick="window.open('https://docs.google.com/spreadsheets/d/1T7GcIbxlqQiaBcjE7LaKAUzANhzzGtS--_xDyKXizCg/edit', '_blank')">
                    <i class="fas fa-calendar-alt has-text-warning"></i>
                    <span>DATA SHEET</span>
                </div>
                <div class="menu-item" onclick="loadFrame('https://drive.google.com/embeddedfolderview?id=1MFgY7V2QDDZzg8251P5qZvyoAbgFcwb7#list')">
                    <i class="fas fa-file-pdf has-text-info"></i>
                    <span>ARKIB PDF</span>
                </div>
            </div>

            <div id="filterPanel" style="display: none;" class="mt-6">
                <div class="box">
                   <div class="columns">
                       <div class="column"><select id="selGuru" class="select is-fullwidth"><option value="">Pilih Guru</option></select></div>
                       <div class="column is-narrow"><button class="button is-link" onclick="drawTable()">SEMAK</button></div>
                   </div>
                   <div id="resultsTable" class="mt-4"></div>
                </div>
            </div>

            <p class="footer-text">Sistem Inovasi Digital: D'SiRe @ 2026</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbx3zn_eWaAKn7Cgljlje0WOvbmM0o0uNpkR5sHX-XesZzZP2B1B3kjgjTp1wo99jwFXEw/exec';
        const sheetID = '1T7GcIbxlqQiaBcjE7LaKAUzANhzzGtS--_xDyKXizCg';

        function loadFrame(url) {
            document.getElementById('mainArea').innerHTML = `<iframe src="${url}"></iframe>`;
        }

        function toggleFilter() {
            document.getElementById('filterPanel').style.display = 'block';
            fetch(scriptURL).then(r => r.json()).then(d => {
                const el = document.getElementById('selGuru');
                el.innerHTML = '<option value="">Pilih Guru...</option>';
                [...new Set(d.guru)].forEach(i => { if(i) el.innerHTML += `<option value="${i}">${i}</option>`; });
            });
        }
        
        // Load Charts API
        google.charts.load('current', {'packages':['table']});
        function drawTable() {
            const guru = document.getElementById('selGuru').value;
            let query = `SELECT B, C, D, E, F, Q, U WHERE B IS NOT NULL AND C = '${guru}'`;
            const url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(query)}&sheet=rekod_semakan`;
            
            fetch(url).then(r => r.text()).then(txt => {
                const json = JSON.parse(txt.substr(47).slice(0, -2));
                const dt = new google.visualization.DataTable();
                dt.addColumn('string', 'Tarikh'); dt.addColumn('string', 'Nama Guru'); dt.addColumn('string', 'Skala'); dt.addColumn('string', 'Link');
                const rows = json.table.rows.map(r => [r.c[0].f, r.c[1].v, r.c[5].v, `<a href="${r.c[6].v}" target="_blank">PDF</a>`]);
                dt.addRows(rows);
                new google.visualization.Table(document.getElementById('resultsTable')).draw(dt, {allowHtml: true, width: '100%'});
            });
        }
    </script>
</body>
</html>
