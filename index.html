<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Unit Kurikulum - SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { 
            --primary-blue: #1e3a8a; 
            --bg-light: #f4f7fa; 
            --sidebar-width: 260px;
        }
        
        body { background-color: var(--bg-light); display: flex; height: 100vh; overflow: hidden; font-family: 'Segoe UI', Roboto, sans-serif; }

        /* SIDEBAR STYLING */
        .sidebar { width: var(--sidebar-width); background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; padding: 0; box-shadow: 2px 0 10px rgba(0,0,0,0.02); }
        .sidebar-header { text-align: center; padding: 30px 20px; }
        .sidebar-header img { width: 50px; margin-bottom: 10px; }
        .sidebar-header .app-name { color: #2563eb; font-weight: 700; font-size: 0.9rem; line-height: 1.2; }
        .sidebar-header .school-name { color: #64748b; font-size: 0.7rem; font-weight: 600; margin-top: 4px; }

        .nav-group-title { padding: 20px 25px 10px; font-size: 0.65rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; letter-spacing: 1px; }
        .nav-link { padding: 12px 25px; display: flex; align-items: center; color: #64748b; cursor: pointer; font-size: 0.85rem; font-weight: 500; transition: 0.2s; margin: 2px 15px; border-radius: 8px; }
        .nav-link i { width: 25px; font-size: 1rem; }
        .nav-link:hover { background: #f1f5f9; color: var(--primary-blue); }
        .nav-link.is-active { background: #eff6ff; color: #1e40af; font-weight: 700; }

        /* MAIN CONTENT AREA */
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; display: flex; flex-direction: column; align-items: center; }
        .header-section { text-align: center; margin-bottom: 50px; width: 100%; }
        .header-section img { width: 70px; margin-bottom: 15px; }
        .header-section h1 { color: #1e3a8a; font-size: 2.2rem; font-weight: 800; }
        .header-section p { color: #64748b; font-size: 1rem; }

        /* CARD MENU STYLING */
        .card-menu { display: flex; justify-content: center; gap: 20px; width: 100%; max-width: 900px; flex-wrap: wrap; }
        .menu-item { 
            background: white; border-radius: 20px; padding: 40px 20px; text-align: center; cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); width: 200px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid transparent;
        }
        .menu-item:hover { transform: translateY(-8px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); border-color: #dbeafe; }
        .menu-item i { font-size: 2.2rem; margin-bottom: 15px; display: block; }
        .menu-item span { font-weight: 700; font-size: 0.75rem; color: #334155; text-transform: uppercase; }

        /* SUB-MENU SEARCH STYLING */
        #searchMenu { display: none; }
        
        /* FILTER PANEL */
        #filterPanel { display: none; background: white; padding: 30px; border-radius: 20px; width: 100%; max-width: 800px; margin-top: 30px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }

        .footer-credit { margin-top: auto; padding: 20px; text-align: center; color: #cbd5e1; font-size: 0.65rem; }
        iframe { width: 100%; height: 85vh; border: none; border-radius: 15px; }

        /* COLORS */
        .icon-blue { color: #1e40af; }
        .icon-red { color: #ef4444; }
        .icon-orange { color: #f59e0b; }
        .icon-green { color: #10b981; }
        .icon-purple { color: #7c3aed; }
    </style>
</head>
<body>

    <div class="sidebar">
        <div class="sidebar-header">
            <img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png" alt="Logo">
            <p class="app-name">Rekod Semakan Buku</p>
            <p class="school-name">SK SIMPANG RENGAM</p>
        </div>

        <div class="nav-link is-active" onclick="location.reload()"><i class="fas fa-home"></i> Laman Utama</div>
        
        <div class="nav-group-title">Menu Utama</div>
        <div class="nav-link" onclick="loadFrame('halaman_semak_buku.html')"><i class="fas fa-edit"></i> Isi Laporan</div>
        <div class="nav-link" onclick="showSearchMenu()"><i class="fas fa-search"></i> Semak Rekod</div>
        <div class="nav-link" onclick="loadFrame('https://drive.google.com/embeddedfolderview?id=1MFgY7V2QDDZzg8251P5qZvyoAbgFcwb7#list')"><i class="fas fa-file-pdf"></i> Arkib PDF</div>

        <div class="footer-credit">Office D'SiRe © 2026</div>
    </div>

    <div class="main-content" id="mainArea">
        <div class="header-section" id="headerSection">
            <img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png">
            <h1>UNIT KURIKULUM</h1>
            <p>SK Simpang Rengam • Rekod Semakan Buku Murid</p>
        </div>

        <div class="card-menu" id="mainMenu">
            <div class="menu-item" onclick="loadFrame('halaman_semak_buku.html')">
                <i class="fas fa-pencil-alt icon-blue"></i>
                <span>ISI LAPORAN</span>
            </div>
            <div class="menu-item" onclick="showSearchMenu()">
                <i class="fas fa-search-plus icon-red"></i>
                <span>SEMAK REKOD</span>
            </div>
            <div class="menu-item" onclick="loadFrame('https://drive.google.com/embeddedfolderview?id=1MFgY7V2QDDZzg8251P5qZvyoAbgFcwb7#list')">
                <i class="fas fa-file-pdf icon-orange"></i>
                <span>ARKIB PDF</span>
            </div>
        </div>

        <div class="card-menu" id="searchMenu">
            <div class="menu-item" onclick="prepareFilter('GURU')">
                <i class="fas fa-user-tie icon-blue"></i>
                <span>NAMA GURU</span>
            </div>
            <div class="menu-item" onclick="prepareFilter('SUBJEK')">
                <i class="fas fa-book icon-green"></i>
                <span>MATA PELAJARAN</span>
            </div>
            <div class="menu-item" onclick="prepareFilter('TARIKH')">
                <i class="fas fa-calendar-day icon-orange"></i>
                <span>TARIKH</span>
            </div>
            <div class="menu-item" onclick="drawAdminRecord()">
                <i class="fas fa-user-shield icon-purple"></i>
                <span>REKOD PENTADBIR</span>
            </div>
            <div style="width: 100%; text-align: center; margin-top: 20px;">
                <button class="button is-text is-small" onclick="location.reload()"> Kembali ke Menu Utama</button>
            </div>
        </div>

        <div id="filterPanel">
            <div class="columns is-vcentered">
                <div class="column is-8" id="inputContainer"></div>
                <div class="column is-4" id="searchBtnContainer">
                    <button class="button is-link is-fullwidth is-rounded" onclick="drawTable()">CARI DATA</button>
                </div>
            </div>
            <div id="resultsTable" class="mt-5"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbxQCYfhi1mqkdIXpeynWeJ1d7Hj-DBs-_n2EHg0azbR3sos8H5HDH6UQhL3-9vgwJtozw/exec';
        const sheetID = '1T7GcIbxlqQiaBcjE7LaKAUzANhzzGtS--_xDyKXizCg';
        let currentFilterMode = '';

        function loadFrame(url) {
            document.getElementById('headerSection').style.display = 'none';
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('searchMenu').style.display = 'none';
            document.getElementById('filterPanel').style.display = 'none';
            const content = `<div style="width:100%;"><button class="button is-small is-light mb-2" onclick="location.reload()"><i class="fas fa-arrow-left mr-2"></i> Kembali ke Dashboard</button><iframe src="${url}"></iframe></div>`;
            document.getElementById('mainArea').innerHTML = content;
        }

        function showSearchMenu() {
            document.getElementById('headerSection').style.display = 'block';
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('searchMenu').style.display = 'flex';
            document.getElementById('filterPanel').style.display = 'none';
        }

        function prepareFilter(mode) {
            currentFilterMode = mode;
            document.getElementById('filterPanel').style.display = 'block';
            document.getElementById('searchBtnContainer').style.display = 'block';
            const container = document.getElementById('inputContainer');
            container.innerHTML = '<p class="is-size-7">Memuatkan senarai...</p>';

            fetch(scriptURL).then(r => r.json()).then(d => {
                if (mode === 'GURU') {
                    let opts = d.guru.map(g => `<option value="${g}">${g}</option>`).join('');
                    container.innerHTML = `<label class="label is-small">Pilih Nama Guru</label><div class="select is-fullwidth is-link"><select id="filterValue"><option value="">-- Senarai Guru --</option>${opts}</select></div>`;
                } 
                else if (mode === 'SUBJEK') {
                    let opts = d.subjek.map(s => `<option value="${s}">${s}</option>`).join('');
                    container.innerHTML = `<label class="label is-small">Pilih Mata Pelajaran</label><div class="select is-fullwidth is-link"><select id="filterValue"><option value="">-- Senarai Subjek --</option>${opts}</select></div>`;
                }
                else if (mode === 'TARIKH') {
                    container.innerHTML = `<label class="label is-small">Pilih Tarikh</label><input type="date" id="filterValue" class="input is-link">`;
                }
            });
        }

        google.charts.load('current', {'packages':['table']});

        // FUNGSI BARU: PAPAR REKOD PENTADBIR
        function drawAdminRecord() {
            document.getElementById('filterPanel').style.display = 'block';
            document.getElementById('inputContainer').innerHTML = '<h3 class="title is-6 has-text-primary">Ringkasan Laporan Pentadbir</h3>';
            document.getElementById('searchBtnContainer').style.display = 'none';
            document.getElementById('resultsTable').innerHTML = 'Menjana ringkasan data pentadbir...';

            // Query untuk mendapatkan Lajur Pentadbir (H) dan Jawatan (I)
            let query = `SELECT H, I, COUNT(B) GROUP BY H, I LABEL COUNT(B) 'Jumlah'`;
            let url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(query)}&sheet=rekod_semakan`;

            fetch(url).then(r => r.text()).then(txt => {
                let json = JSON.parse(txt.substr(47).slice(0, -2));
                let dt = new google.visualization.DataTable();
                dt.addColumn('string', 'Nama Pentadbir');
                dt.addColumn('string', 'Jawatan');
                dt.addColumn('number', 'Jumlah Semakan');

                let rows = json.table.rows.map(r => [
                    r.c[0]?.v || "Tiada Nama",
                    r.c[1]?.v || "-",
                    r.c[2]?.v || 0
                ]);

                dt.addRows(rows);
                new google.visualization.Table(document.getElementById('resultsTable')).draw(dt, {allowHtml: true, width: '100%'});
            });
        }

        function drawTable() {
            const val = document.getElementById('filterValue').value;
            if(!val) return;
            
            document.getElementById('resultsTable').innerHTML = 'Menyusun maklumat...';
            
            let query = "";
            if(currentFilterMode === 'GURU') query = `SELECT B, C, D, E, F, Q, U WHERE C = '${val}'`;
            if(currentFilterMode === 'SUBJEK') query = `SELECT B, C, D, E, F, Q, U WHERE F = '${val}'`;
            if(currentFilterMode === 'TARIKH') {
                let d = val.split('-');
                query = `SELECT B, C, D, E, F, Q, U WHERE B = '${d[2]}/${d[1]}/${d[0]}'`;
            }

            let url = `https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(query)}&sheet=rekod_semakan`;

            fetch(url).then(r => r.text()).then(txt => {
                let json = JSON.parse(txt.substr(47).slice(0, -2));
                let dt = new google.visualization.DataTable();
                dt.addColumn('string', 'Tarikh');
                dt.addColumn('string', 'Guru');
                dt.addColumn('string', 'Kelas');
                dt.addColumn('string', 'Subjek');
                dt.addColumn('string', 'Skala');
                dt.addColumn('string', 'Dokumen');

                let rows = json.table.rows.map(r => [
                    r.c[0] ? r.c[0].f : "",
                    r.c[1]?.v || "",
                    (r.c[2]?.v || "") + " " + (r.c[3]?.v || ""),
                    r.c[4]?.v || "",
                    r.c[5]?.v || "",
                    r.c[6] ? `<a href="${r.c[6].v}" target="_blank" class="button is-small is-link is-outlined">LIHAT PDF</a>` : "Tiada"
                ]);

                dt.addRows(rows);
                new google.visualization.Table(document.getElementById('resultsTable')).draw(dt, {allowHtml: true, width: '100%', pageSize: 10});
            });
        }
    </script>
</body>
</html>
