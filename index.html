<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pengurusan Unit Kurikulum - SK Simpang Rengam</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    <style>
        :root { --primary: #1e3a8a; --bg: #f4f7fa; }
        body { background-color: var(--bg); display: flex; height: 100vh; overflow: hidden; }
        .sidebar { width: 260px; background: white; border-right: 1px solid #e2e8f0; display: flex; flex-direction: column; }
        .nav-link { padding: 12px 25px; color: #64748b; cursor: pointer; border-radius: 8px; margin: 2px 15px; }
        .nav-link:hover, .nav-link.is-active { background: #eff6ff; color: var(--primary); font-weight: 700; }
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; text-align: center; }
        iframe { width: 100%; height: 85vh; border: none; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .card-menu { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; }
        .menu-item { background: white; border-radius: 18px; padding: 30px; width: 200px; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .menu-item:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #searchMenu, #filterPanel { display: none; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="p-5 text-center"><img src="https://raw.githubusercontent.com/azizahshariff/rekod-semakan-buku/main/logo_sksr.png" width="60"><p class="mt-2 has-text-weight-bold" style="color:var(--primary)">SK SIMPANG RENGAM</p></div>
        <div class="nav-link is-active" onclick="location.reload()"><i class="fas fa-home mr-3"></i> Laman Utama</div>
        <div class="nav-link" onclick="loadFrame('halaman_semak_buku.html')"><i class="fas fa-edit mr-3"></i> Isi Laporan</div>
        <div class="nav-link" onclick="showSearchMenu()"><i class="fas fa-search mr-3"></i> Semak Rekod</div>
    </div>

    <div class="main-content" id="mainArea">
        <div id="headerSection" class="mb-6">
            <h1 class="title is-3" style="color: var(--primary);">PENGURUSAN UNIT KURIKULUM</h1>
            <p class="subtitle is-6">Rekod Semakan Buku Murid Secara Digital</p>
        </div>

        <div class="card-menu" id="mainMenu">
            <div class="menu-item" onclick="loadFrame('halaman_semak_buku.html')"><i class="fas fa-pencil-alt fa-3x mb-3 has-text-link"></i><br><span>ISI LAPORAN</span></div>
            <div class="menu-item" onclick="showSearchMenu()"><i class="fas fa-search fa-3x mb-3 has-text-danger"></i><br><span>SEMAK REKOD</span></div>
        </div>

        <div class="card-menu" id="searchMenu">
            <div class="menu-item" onclick="prepareFilter('GURU')"><i class="fas fa-user-tie fa-2x mb-2"></i><br>NAMA GURU</div>
            <div class="menu-item" onclick="prepareFilter('SUBJEK')"><i class="fas fa-book fa-2x mb-2"></i><br>SUBJEK</div>
            <div class="menu-item" onclick="drawAdminRecord()"><i class="fas fa-shield-alt fa-2x mb-2"></i><br>PENTADBIR</div>
        </div>

        <div id="filterPanel" class="box mt-5 mx-auto" style="max-width:800px;">
            <div id="inputContainer"></div>
            <div id="resultsTable" class="mt-5"></div>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycby-_Xfhnsdiftrk_YF8rCyyNYDHVASk_WUbQzgFURsiHHlOZJDzbN1epDdqyr68NPoFbw/exec';
        const sheetID = '1T7GcIbxlqQiaBcjE7LaKAUzANhzzGtS--_xDyKXizCg';

        function loadFrame(url) {
            document.getElementById('mainArea').innerHTML = `<button class="button is-small mb-2" onclick="location.reload()">← Kembali</button><iframe src="${url}"></iframe>`;
        }

        function showSearchMenu() {
            document.getElementById('mainMenu').style.display = 'none';
            document.getElementById('searchMenu').style.display = 'flex';
        }

        function prepareFilter(mode) {
            document.getElementById('filterPanel').style.display = 'block';
            const container = document.getElementById('inputContainer');
            container.innerHTML = 'Memuatkan senarai...';
            
            fetch(scriptURL + "?getLists=true").then(r => r.json()).then(d => {
                let list = mode === 'GURU' ? d.guru : d.subjek;
                let opts = list.map(i => `<option value="${i}">${i}</option>`).join('');
                container.innerHTML = `<div class="field has-addons"><div class="control is-expanded"><div class="select is-fullwidth"><select id="fVal">${opts}</select></div></div><div class="control"><button class="button is-link" onclick="drawTable('${mode}')">CARI</button></div></div>`;
            });
        }

        google.charts.load('current', {'packages':['table']});

        function drawTable(mode) {
            const val = document.getElementById('fVal').value;
            let q = mode === 'GURU' ? `SELECT B, C, F, Q, U WHERE C = '${val}'` : `SELECT B, C, F, Q, U WHERE F = '${val}'`;
            fetch(`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${encodeURIComponent(q)}&sheet=rekod_semakan`)
            .then(r => r.text()).then(t => {
                let j = JSON.parse(t.substr(47).slice(0,-2));
                let dt = new google.visualization.DataTable();
                dt.addColumn('string', 'Tarikh'); dt.addColumn('string', 'Guru'); dt.addColumn('string', 'Subjek'); dt.addColumn('string', 'Skala'); dt.addColumn('string', 'PDF');
                dt.addRows(j.table.rows.map(r => [r.c[0].f, r.c[1].v, r.c[2].v, r.c[3].v, `<a href="${r.c[4].v}" target="_blank" class="button is-small is-danger">PDF</a>`]));
                new google.visualization.Table(document.getElementById('resultsTable')).draw(dt, {allowHtml:true, width:'100%', pageSize: 10});
            });
        }

        function drawAdminRecord() {
            document.getElementById('filterPanel').style.display = 'block';
            document.getElementById('inputContainer').innerHTML = '<strong>Rekod Semakan Pentadbir</strong>';
            let q = encodeURIComponent(`SELECT S, T, B, C, F, U ORDER BY B DESC`);
            fetch(`https://docs.google.com/spreadsheets/d/${sheetID}/gviz/tq?tqx=out:json&tq=${q}&sheet=rekod_semakan`)
            .then(r => r.text()).then(t => {
                let j = JSON.parse(t.substr(47).slice(0,-2));
                let dt = new google.visualization.DataTable();
                dt.addColumn('string', 'Pentadbir'); dt.addColumn('string', 'Jawatan'); dt.addColumn('string', 'Tarikh'); dt.addColumn('string', 'Guru'); dt.addColumn('string', 'Subjek'); dt.addColumn('string', 'Fail');
                dt.addRows(j.table.rows.map(r => [r.c[0].v, r.c[1].v, r.c[2].f || r.c[2].v, r.c[3].v, r.c[4].v, `<a href="${r.c[5].v}" target="_blank" class="button is-small is-danger">LINK</a>`]));
                new google.visualization.Table(document.getElementById('resultsTable')).draw(dt, {allowHtml:true, width:'100%', pageSize: 10});
            });
        }
    </script>
</body>
</html>
